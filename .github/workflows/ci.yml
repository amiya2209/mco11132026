name: Python tests
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Install Flask
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest -v
